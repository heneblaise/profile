<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | HB Creative</title>

<style>
:root {
  --ink: #f8fafc;
  --muted: #a7b3c7;
  --paper: #080d18;
  --panel: #111827;
  --line: rgba(148, 163, 184, 0.22);
  --brand: #22d3ee;
  --accent: #f97316;
  --deep: #050816;
  --shadow: 0 22px 60px rgba(0, 0, 0, 0.38);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  background:
    linear-gradient(135deg, rgba(8, 13, 24, 0.96), rgba(17, 24, 39, 0.92)),
    radial-gradient(circle at top right, rgba(34, 211, 238, 0.2), transparent 32%);
  color: var(--ink);
  font-family: Inter, "Segoe UI", Arial, sans-serif;
  line-height: 1.6;
  padding: 24px;
}

.container {
  width: min(460px, 100%);
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  box-shadow: var(--shadow);
  padding: 38px;
  text-align: center;
}

.icon {
  display: grid;
  width: 62px;
  height: 62px;
  margin: 0 auto 22px;
  place-items: center;
  border-radius: 8px;
  background: rgba(34, 211, 238, 0.14);
  color: var(--brand);
  font-size: 2rem;
  font-weight: 900;
}

h1 {
  margin-bottom: 12px;
  font-size: clamp(2rem, 9vw, 3rem);
  line-height: 1;
}

p {
  margin-bottom: 26px;
  color: var(--muted);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--brand), #2563eb);
  color: #03111f;
  font-weight: 750;
  padding: 12px 18px;
  text-decoration: none;
}

.btn:hover {
  background: var(--brand);
}
</style>
</head>

<body>
<main class="container">
  <div class="icon">✓</div>
  <h1>Message Sent</h1>
  <p>Thank you for reaching out. I have received your message and will get back to you as soon as possible.</p>
  <a href="index.html" class="btn">Back to Homepage</a>
</main>
</body>
</html>
